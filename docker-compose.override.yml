# Docker Compose Override for Development
# This file is automatically loaded by docker-compose and overrides settings for development

version: "3.8"

services:
  # Development overrides for backend
  backend:
    environment:
      # Development settings
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development

      # Allow hot reload
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      # Mount source code for development
      - ./backend:/app:ro
      - scan_workspace:/app/workspace
      - scanner_cache:/app/.cache
      - backend_logs:/app/logs

    ports:
      - "8000:8000"
      - "8001:8001" # Debug port

    command: >
      bash -c "
        echo 'Starting in development mode...' &&
        pip install debugpy &&
        python -m debugpy --listen 0.0.0.0:8001 --wait-for-client -m uvicorn app:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "

  # Development overrides for frontend
  frontend:
    environment:
      - NODE_ENV=development

    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro

    # Use development server instead of nginx
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development

    command: npm run dev -- --host 0.0.0.0 --port 3000

    ports:
      - "3000:3000" # Development server
      - "80:80" # Production nginx (for testing)

  # Development MongoDB with less strict settings
  mongodb:
    environment:
      # Development database settings
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword123
      MONGO_INITDB_DATABASE: securedevops_dev

    ports:
      - "27017:27017"

    # Enable MongoDB logging
    command: >
      bash -c "
        mongod --auth --bind_ip_all --logpath /var/log/mongodb/mongod.log --logappend --verbose
      "

  # Development Redis
  redis:
    command: redis-server --appendonly yes --requirepass devredispass123 --loglevel verbose

    ports:
      - "6379:6379"

# Development-specific networks and volumes
networks:
  securedevops-network:
    driver: bridge

volumes:
  # Development volumes with more permissive settings
  mongodb_data:
  redis_data:
  scan_workspace:
  scanner_cache:
  backend_logs:
