[providers]
python = "3.11"

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"

[phases.setup]
nixPkgs = ['python311', 'pip', 'gcc']

[phases.install]
cmds = [
  'pip install --upgrade pip',
  'pip install -r backend/requirements.railway.txt'
]

[phases.build]
cmds = ['echo "FastAPI backend - no build step required"']

[start]
cmd = 'python main.py'
