[providers]
python = "3.11"

[phases.setup]
nixPkgs = ['python311', 'pip']

[phases.install]
cmds = ['pip install -r backend/requirements.railway.txt']

[phases.build]
cmds = ['echo "No build step needed for FastAPI"']

[start]
cmd = 'cd backend && python -m uvicorn app:app --host 0.0.0.0 --port $PORT'
