<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main hexagon body -->
  <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" fill="url(#bg-grad)" stroke="url(#stroke-grad)" stroke-width="1.5"/>
  
  <!-- Inner hexagon accent -->
  <path d="M16 6L24 10.5V21.5L16 26L8 21.5V10.5L16 6Z" fill="none" stroke="url(#stroke-grad)" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Quantum ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="url(#eye-grad)" stroke-width="0.75" opacity="0.5"/>
  <circle cx="16" cy="16" r="5" fill="none" stroke="url(#eye-grad)" stroke-width="1" opacity="0.7"/>
  
  <!-- AI Eye core -->
  <circle cx="16" cy="16" r="4" fill="url(#eye-grad)" opacity="0.2"/>
  <circle cx="16" cy="16" r="3" fill="#0e7490" filter="url(#glow)"/>
  <circle cx="16" cy="16" r="2" fill="url(#core-grad)"/>
  <circle cx="16" cy="16" r="1" fill="#67e8f9"/>
  <circle cx="15" cy="15" r="0.4" fill="white"/>
  
  <!-- Corner accents -->
  <circle cx="16" cy="6" r="0.8" fill="#22d3ee" opacity="0.7"/>
  <circle cx="16" cy="26" r="0.8" fill="#22d3ee" opacity="0.7"/>
</svg>
