services:
  mongodb:
    image: mongo:7
    container_name: onyx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - onyx-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onyx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/onyx
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    networks:
      - onyx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onyx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - onyx-network

networks:
  onyx-network:
    driver: bridge

volumes:
  mongodb_data:
  backend_data:
