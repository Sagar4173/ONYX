services:
  mongodb:
    image: mongo:7
    container_name: onyx-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - onyx-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onyx-backend
    restart: unless-stopped
    # No host port mapping: the backend must only be reachable through the
    # frontend nginx proxy (which sets a trustworthy X-Forwarded-For for
    # rate limiting and keeps the API off the public interface).
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/onyx
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_URL=http://localhost:8000
      - AI_LOCAL_BASE_URL=http://ollama:11434/v1
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    networks:
      - onyx-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: onyx-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - onyx-network
    deploy:
      resources:
        limits:
          memory: 8g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onyx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - onyx-network

networks:
  onyx-network:
    driver: bridge

volumes:
  mongodb_data:
  backend_data:
  ollama_data:
