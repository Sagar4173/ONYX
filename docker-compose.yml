# Docker Compose for SecureDevOps AI Platform
version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: securedevops-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-securepass123}
      MONGO_INITDB_DATABASE: securedevops
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - securedevops-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API with Gunicorn + Uvicorn Workers
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securedevops-backend
    restart: unless-stopped
    environment:
      # Database
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-securepass123}@mongodb:27017/securedevops?authSource=admin

      # Security
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}

      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      WORKERS: "4"

      # CORS and Rate Limiting
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://frontend,http://localhost}
      RATE_LIMIT: ${RATE_LIMIT:-100}

      # Security Scanners
      ENABLE_SEMGREP: "true"
      ENABLE_TRIVY: "true"
      ENABLE_GITLEAKS: "true"
      ENABLE_LYNIS: "true"
    volumes:
      - scan_workspace:/app/workspace
      - scanner_cache:/app/.cache
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - securedevops-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Nginx serving React build
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securedevops-frontend
    restart: unless-stopped
    environment:
      # Backend API endpoint for proxy
      BACKEND_URL: http://backend:8000
    ports:
      - "80:80"
      - "443:443"
    networks:
      - securedevops-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: securedevops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass123}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - securedevops-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  securedevops-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
    name: securedevops_mongodb_data
  redis_data:
    driver: local
    name: securedevops_redis_data
  scan_workspace:
    driver: local
    name: securedevops_scan_workspace
  scanner_cache:
    driver: local
    name: securedevops_scanner_cache
  backend_logs:
    driver: local
    name: securedevops_backend_logs
