# ONYX Platform - Docker Compose (Production)
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: onyx-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=onyx
    networks:
      - onyx-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: onyx-backend
    restart: always
    expose:
      - "8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/onyx
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://yourdomain.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - onyx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-wss://yourdomain.com}
    container_name: onyx-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - onyx-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: onyx-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # Mount SSL certificates
    depends_on:
      - frontend
      - backend
    networks:
      - onyx-network

networks:
  onyx-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
