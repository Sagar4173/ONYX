# Render Blueprint - ONYX Security Intelligence Platform
# https://render.com/docs/blueprint-spec
#
# To use: Render Dashboard → New → Blueprint → Connect repo

services:
  - type: web
    name: onyx-backend
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # Set manually: https://onyx-platform.vercel.app,http://localhost:5173
      - key: OPENAI_API_KEY
        sync: false # Optional: Set manually if using AI features
      - key: GOOGLE_AI_API_KEY
        sync: false # Optional: Set manually if using AI features
      - key: GEMINI_API_KEY
        sync: false # Optional: Set manually if using Gemini AI
