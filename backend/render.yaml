# Render Blueprint - ONYX Security Intelligence Platform
# https://render.com/docs/blueprint-spec
# Optimized for 512MB free tier with lazy-loaded semgrep

services:
  - type: web
    name: onyx-backend
    runtime: python
    region: oregon # or singapore, frankfurt, ohio
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT --timeout 120 --max-requests 100
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # Set manually - your frontend URL (e.g., https://onyx-platform.vercel.app)
      - key: OPENAI_API_KEY
        sync: false # Set manually if using AI features
      - key: GOOGLE_AI_API_KEY
        sync: false # Set manually if using AI features
      - key: GEMINI_API_KEY
        sync: false # Set manually if using Gemini AI
      # Memory optimization
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
