category: secrets
cwe_mappings:
- CWE-798
description: Template for detecting hardcoded secrets
examples: []
name: Hardcoded Secret Detection
template_content:
  message: Potential hardcoded secret detected
  pattern: (?i)(password|secret|key|token)\s*[=:]\s*['\"]([^'\"]{8,})['\"]
template_id: hardcoded_secret_template
type: !!python/object/apply:services.rules.rule_security.AllowedRuleType
- regex
variables:
- default: password|secret|key|token
  description: Keywords to detect
  name: secret_keywords
- default: '8'
  description: Minimum secret length
  name: min_length
