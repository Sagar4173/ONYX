category: injection
cwe_mappings:
- CWE-89
description: Template for detecting SQL injection vulnerabilities
examples: []
name: SQL Injection Detection
template_content:
  rules:
  - id: custom-sql-injection
    languages:
    - python
    - javascript
    - java
    message: Potential SQL injection vulnerability
    pattern-either:
    - pattern: cursor.execute($QUERY, ...)
    - pattern: cursor.execute($QUERY)
    pattern-not:
      pattern: cursor.execute("...", ...)
    severity: ERROR
template_id: sql_injection_template
type: !!python/object/apply:services.rules.rule_security.AllowedRuleType
- semgrep
variables:
- default: $QUERY
  description: SQL query pattern
  name: query_pattern
