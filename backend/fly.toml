# ONYX Backend - Fly.io Deployment Configuration
# Full-featured deployment with all scanning and ML capabilities

app = "onyx-backend"
primary_region = "sjc"  # San Jose - change to: iad (Virginia), lhr (London), sin (Singapore)

[build]

[env]
  ENVIRONMENT = "production"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [http_service.http_options]
    h2_backend = false

[[vm]]
  memory = "1gb"  # 1GB RAM for full features (numpy, scipy, scanning tools)
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "30s"
    method = "get"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
